name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - run: bun install --frozen-lockfile

      - run: bun run build:native

      - run: bun scripts/native-smoke.ts

      - run: bun run check:dependencies

      - run: bun run check:deps

      - run: bun run check:deadcode

      - run: bun run lint

      - run: bun run format:check

      - run: bun run typecheck

      - run: bun test

      - run: bun run build

      - run: bun scripts/package-smoke.ts

      - run: bun scripts/source-smoke.ts
