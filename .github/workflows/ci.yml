name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    # A hung suite fails here instead of holding a runner for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - run: bun install --frozen-lockfile

      - run: bun run build:native

      - run: bun scripts/native-smoke.ts

      # Static checks give the same answer on every OS, so they run once.
      - run: bun run check:dependencies
        if: runner.os == 'Linux'

      - run: bun run check:deps
        if: runner.os == 'Linux'

      - run: bun run check:deadcode
        if: runner.os == 'Linux'

      - run: bun run lint
        if: runner.os == 'Linux'

      - run: bun run format:check
        if: runner.os == 'Linux'

      - run: bun run typecheck
        if: runner.os == 'Linux'

      - run: bun run test

      - run: bun run build

      - run: bun scripts/package-smoke.ts

      - run: bun scripts/source-smoke.ts
