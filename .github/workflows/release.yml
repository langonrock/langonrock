name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # darwin must build on macOS: Bun writes a broken code signature for
          # every darwin target, and only codesign can repair it.
          # `smoke: true` marks the targets the runner can execute natively.
          # It is an explicit flag rather than a condition over the target name
          # because the first version of that condition excluded every arm64
          # target, which silently skipped the one binary that most needs
          # checking: darwin-arm64 is what the codesign repair applies to, and
          # macos-latest is itself arm64.
          - runner: macos-latest
            target: bun-darwin-arm64
            artifact: langonrock-darwin-arm64
            smoke: true
          - runner: macos-latest
            target: bun-darwin-x64
            artifact: langonrock-darwin-x64
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: langonrock-linux-x64
            smoke: true
          - runner: ubuntu-latest
            target: bun-linux-arm64
            artifact: langonrock-linux-arm64
          - runner: ubuntu-latest
            target: bun-windows-x64
            artifact: langonrock-windows-x64.exe
          - runner: ubuntu-latest
            target: bun-windows-arm64
            artifact: langonrock-windows-arm64.exe

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Refuse to release a tag that disagrees with package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun --print 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: bun scripts/build.ts --target ${{ matrix.target }} --outfile dist/${{ matrix.artifact }}

      # Starting is not working. This stores a real bundle and reads it back,
      # so a binary that launches but cannot compile or read a snapshot fails
      # here instead of in someone's install.
      - name: Smoke test the binary it just built
        if: matrix.smoke
        shell: bash
        run: |
          set -eu
          bin="./dist/${{ matrix.artifact }}"
          store="$RUNNER_TEMP/smoke-store"

          "$bin" --version
          "$bin" put test/fixtures/sales --data "$store" --tenant smoke
          "$bin" manifest --data "$store" --tenant smoke | grep -q '^# tenant: smoke'
          "$bin" query "okf://$store?tenant=smoke" search churned | grep -q '^# hits'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum every artifact
        working-directory: dist
        run: |
          sha256sum langonrock-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/langonrock-* dist/SHA256SUMS
